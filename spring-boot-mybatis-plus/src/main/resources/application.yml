spring:
  datasource:
    url: jdbc:mysql://192.168.31.161:3306/mp?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    net.xzh: debug
  pattern:
    dateformat: HH:mm:ss
      
mybatis-plus:
  # Mapper.xml 文件位置
  mapper-locations: classpath:/mapper/*Mapper.xml
  # 实体类扫描包（用于在XML中直接使用类名）
  type-aliases-package: net.xzh.generator.model
  global-config:
    db-config:
      # 主键策略：ASSIGN_ID 为雪花算法ID
      id-type: ASSIGN_ID
      # 逻辑删除字段名
      logic-delete-field: del_flag
      # 逻辑已删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0
  configuration:
    # 开启驼峰命名自动映射
    map-underscore-to-camel-case: true

# 安全路径白名单
secure:
  ignored:
    urls:
      - /generator/**
      - /sysuser/**
      - /swagger-ui/**
      - /api-docs/**

## SpringDoc 配置
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    # 标签排序方式
    tags-sorter: alpha
    # 操作排序方式
    operations-sorter: alpha
    # 保持认证状态
    persistAuthorization: true
    # 隐藏models
    default-models-expand-depth: -1
  packages-to-scan: net.xzh
  paths-to-match: /**